// ── TOOLTIP CUSTOM ──────────────────────────────────────────────────────────
const CustomTooltip = ({ active, payload, label }) => {
  if (!active || !payload?.length) return null;
  return (
    <div style={{ background: "#1E1E2E", border: `1px solid ${PALETTE.border}`, borderRadius: 10, padding: "10px 16px", fontSize: 12 }}>
      <p style={{ color: PALETTE.text, fontWeight: 700, marginBottom: 6 }}>{label}</p>
      {payload.map((p, i) => (
        <p key={i} style={{ color: p.color || PALETTE.text, margin: "2px 0" }}>
          {p.name}: <strong>{fmtM(p.value)}</strong>
        </p>
      ))}
    </div>
  );
};

// ── CHART 1: Ciudades grandes vs pequeñas — Ingresos y Utilidad promedio ───
function ChartTamano() {
  const grandes = EVENTOS.filter(e => e.tamano === "Ciudad Grande");
  const pequeñas = EVENTOS.filter(e => e.tamano === "Ciudad Pequeña");

  const avg = (arr, key) => arr.reduce((s, e) => s + e[key], 0) / arr.length;
  const sum = (arr, key) => arr.reduce((s, e) => s + e[key], 0);

  const data = [
    {
      tipo: "Ciudad Grande",
      "Ingreso Prom.": Math.round(avg(grandes, "ingresos")),
      "Utilidad Prom.": Math.round(avg(grandes, "utilidad")),
      "Total Ingresos": sum(grandes, "ingresos"),
      "Total Utilidad": sum(grandes, "utilidad"),
      eventos: grandes.length,
    },
    {
      tipo: "Ciudad Pequeña",
      "Ingreso Prom.": Math.round(avg(pequeñas, "ingresos")),
      "Utilidad Prom.": Math.round(avg(pequeñas, "utilidad")),
      "Total Ingresos": sum(pequeñas, "ingresos"),
      "Total Utilidad": sum(pequeñas, "utilidad"),
      eventos: pequeñas.length,
    },
  ];

  return (
    <div style={styles.card}>
      <h3 style={styles.cardTitle}>📍 Ciudad Grande vs Ciudad Pequeña — Promedio por Evento</h3>
      <p style={styles.cardSub}>
        Ciudades grandes: {grandes.length} eventos · Ciudades pequeñas: {pequeñas.length} eventos
      </p>
      <ResponsiveContainer width="100%" height={280}>
        <BarChart data={data} barGap={8} barCategoryGap="30%">
          <CartesianGrid strokeDasharray="3 3" stroke={PALETTE.border} />
          <XAxis dataKey="tipo" tick={{ fill: PALETTE.muted, fontSize: 13, fontFamily: "'Bebas Neue', cursive" }} />
          <YAxis tickFormatter={fmtMshort} tick={{ fill: PALETTE.muted, fontSize: 11 }} />
          <Tooltip content={<CustomTooltip />} />
          <Legend wrapperStyle={{ color: PALETTE.muted, fontSize: 12 }} />
          <Bar dataKey="Ingreso Prom." fill={PALETTE.grande} radius={[6, 6, 0, 0]}>
            <LabelList dataKey="Ingreso Prom." position="top" formatter={fmtMshort} style={{ fill: PALETTE.text, fontSize: 11 }} />
          </Bar>
          <Bar dataKey="Utilidad Prom." fill={PALETTE.pequeña} radius={[6, 6, 0, 0]}>
            <LabelList dataKey="Utilidad Prom." position="top" formatter={fmtMshort} style={{ fill: PALETTE.text, fontSize: 11 }} />
          </Bar>
        </BarChart>
      </ResponsiveContainer>
      {/* Totales */}
      <div style={{ display: "flex", gap: 16, marginTop: 16 }}>
        {data.map(d => (
          <div key={d.tipo} style={{ flex: 1, background: "#1E1E2E", borderRadius: 10, padding: "12px 16px", border: `1px solid ${PALETTE.border}` }}>
            <p style={{ color: PALETTE.muted, fontSize: 11, margin: 0 }}>{d.tipo}</p>
            <p style={{ color: PALETTE.text, fontSize: 13, fontWeight: 700, margin: "4px 0" }}>Total ingresos: <span style={{ color: PALETTE.grande }}>{fmtM(d["Total Ingresos"])}</span></p>
            <p style={{ color: PALETTE.text, fontSize: 13, fontWeight: 700, margin: 0 }}>Total utilidad: <span style={{ color: PALETTE.pequeña }}>{fmtM(d["Total Utilidad"])}</span></p>
          </div>
        ))}
      </div>
    </div>
  );
}

// ── CHART 2: Utilidad por tipo de venue ────────────────────────────────────
function ChartVenue() {
  const tipos = ["Arena", "Estadio", "Palenque"];
  const colores = { Arena: PALETTE.arena, Estadio: PALETTE.estadio, Palenque: PALETTE.palenque };

  const data = tipos.map(t => {
    const evs = EVENTOS.filter(e => e.venue === t);
    return {
      venue: t,
      "Utilidad Prom.": Math.round(evs.reduce((s, e) => s + e.utilidad, 0) / evs.length),
      "Ingreso Prom.": Math.round(evs.reduce((s, e) => s + e.ingresos, 0) / evs.length),
      "Total Utilidad": evs.reduce((s, e) => s + e.utilidad, 0),
      eventos: evs.length,
      color: colores[t],
    };
  });

  return (
    <div style={styles.card}>
      <h3 style={styles.cardTitle}>🎪 Utilidad por Tipo de Venue</h3>
      <p style={styles.cardSub}>Promedio de utilidad neta por show según venue</p>
      <ResponsiveContainer width="100%" height={280}>
        <BarChart data={data} barCategoryGap="35%">
          <CartesianGrid strokeDasharray="3 3" stroke={PALETTE.border} />
          <XAxis dataKey="venue" tick={{ fill: PALETTE.muted, fontSize: 14, fontFamily: "'Bebas Neue', cursive" }} />
          <YAxis tickFormatter={fmtMshort} tick={{ fill: PALETTE.muted, fontSize: 11 }} />
          <Tooltip content={<CustomTooltip />} />
          <Bar dataKey="Utilidad Prom." radius={[8, 8, 0, 0]}>
            {data.map((entry, i) => (
              <Cell key={i} fill={entry.color} />
            ))}
            <LabelList dataKey="Utilidad Prom." position="top" formatter={fmtMshort} style={{ fill: PALETTE.text, fontSize: 12, fontWeight: 700 }} />
          </Bar>
        </BarChart>
      </ResponsiveContainer>
      <div style={{ display: "flex", gap: 12, marginTop: 16 }}>
        {data.map(d => (
          <div key={d.venue} style={{ flex: 1, background: "#1E1E2E", borderRadius: 10, padding: "12px 14px", borderTop: `3px solid ${d.color}` }}>
            <p style={{ color: d.color, fontSize: 14, fontWeight: 800, margin: "0 0 4px", fontFamily: "'Bebas Neue', cursive", letterSpacing: 1 }}>{d.venue}</p>
            <p style={{ color: PALETTE.muted, fontSize: 11, margin: "0 0 2px" }}>{d.eventos} shows</p>
            <p style={{ color: PALETTE.text, fontSize: 12, margin: "0 0 2px" }}>Prom: <strong>{fmtM(d["Utilidad Prom."])}</strong></p>
            <p style={{ color: PALETTE.text, fontSize: 12, margin: 0 }}>Total: <strong>{fmtM(d["Total Utilidad"])}</strong></p>
          </div>
        ))}
      </div>
    </div>
  );
}

// ── CHART 3: Ingresos vs Utilidad por ciudad (top ciudades) ────────────────
function ChartTopCiudades() {
  const sorted = [...EVENTOS].sort((a, b) => b.utilidad - a.utilidad).slice(0, 15);
  const colores = { Arena: PALETTE.arena, Estadio: PALETTE.estadio, Palenque: PALETTE.palenque };

  const data = sorted.map(e => ({
    name: e.ciudad.length > 14 ? e.ciudad.slice(0, 13) + "…" : e.ciudad,
    fullName: e.ciudad,
    Ingresos: Math.round(e.ingresos),
    Utilidad: Math.round(e.utilidad),
    venue: e.venue,
    color: colores[e.venue],
  }));

  return (
    <div style={styles.card}>
      <h3 style={styles.cardTitle}>🏆 Top 15 Eventos por Utilidad</h3>
      <p style={styles.cardSub}>
        <span style={{ color: PALETTE.arena }}>■ Arena</span>{"  "}
        <span style={{ color: PALETTE.estadio }}>■ Estadio</span>{"  "}
        <span style={{ color: PALETTE.palenque }}>■ Palenque</span>
      </p>
      <ResponsiveContainer width="100%" height={360}>
        <BarChart data={data} layout="vertical" barGap={4} margin={{ left: 20, right: 30 }}>
          <CartesianGrid strokeDasharray="3 3" stroke={PALETTE.border} horizontal={false} />
          <XAxis type="number" tickFormatter={fmtMshort} tick={{ fill: PALETTE.muted, fontSize: 10 }} />
          <YAxis type="category" dataKey="name" tick={{ fill: PALETTE.muted, fontSize: 10 }} width={110} />
          <Tooltip content={<CustomTooltip />} />
          <Bar dataKey="Ingresos" fill="#2A2A4A" radius={[0, 4, 4, 0]} />
          <Bar dataKey="Utilidad" radius={[0, 4, 4, 0]}>
            {data.map((entry, i) => (
              <Cell key={i} fill={entry.color} />
            ))}
            <LabelList dataKey="Utilidad" position="right" formatter={fmtMshort} style={{ fill: PALETTE.text, fontSize: 10 }} />
          </Bar>
        </BarChart>
      </ResponsiveContainer>
    </div>
  );
}

// ── CHART 4: Distribución por venue (pie) ─────────────────────────────────
function ChartPie() {
  const tipos = ["Arena", "Estadio", "Palenque"];
  const colores = { Arena: PALETTE.arena, Estadio: PALETTE.estadio, Palenque: PALETTE.palenque };

  const data = tipos.map(t => ({
    name: t,
    value: Math.round(EVENTOS.filter(e => e.venue === t).reduce((s, e) => s + e.utilidad, 0)),
    color: colores[t],
  }));

  const total = data.reduce((s, d) => s + d.value, 0);

  return (
    <div style={styles.card}>
      <h3 style={styles.cardTitle}>🥧 Distribución de Utilidad Total por Venue</h3>
      <p style={styles.cardSub}>Participación de cada tipo de venue en la utilidad global</p>
      <div style={{ display: "flex", alignItems: "center", gap: 20 }}>
        <ResponsiveContainer width="50%" height={220}>
          <PieChart>
            <Pie data={data} cx="50%" cy="50%" innerRadius={55} outerRadius={90} paddingAngle={3} dataKey="value">
              {data.map((entry, i) => (
                <Cell key={i} fill={entry.color} />
              ))}
            </Pie>
            <Tooltip formatter={(v) => fmtM(v)} />
          </PieChart>
        </ResponsiveContainer>
        <div style={{ flex: 1 }}>
          {data.map(d => (
            <div key={d.name} style={{ marginBottom: 14 }}>
              <div style={{ display: "flex", justifyContent: "space-between", marginBottom: 4 }}>
                <span style={{ color: d.color, fontWeight: 700, fontSize: 13 }}>{d.name}</span>
                <span style={{ color: PALETTE.text, fontSize: 12 }}>{((d.value / total) * 100).toFixed(1)}%</span>
              </div>
              <div style={{ background: PALETTE.border, borderRadius: 4, height: 8, overflow: "hidden" }}>
                <div style={{ background: d.color, width: `${(d.value / total) * 100}%`, height: "100%", borderRadius: 4 }} />
              </div>
              <p style={{ color: PALETTE.muted, fontSize: 11, margin: "3px 0 0" }}>{fmtM(d.value)}</p>
            </div>
          ))}
        </div>
      </div>
    </div>
  );
}

  const colores = { Arena: PALETTE.arena, Estadio: PALETTE.estadio, Palenque: PALETTE.palenque };

  const data = EVENTOS.map(e => ({
    x: Math.round(e.ingresos / 1e6 * 10) / 10,
    y: Math.round(e.utilidad / 1e6 * 10) / 10,
    venue: e.venue,
    ciudad: e.ciudad,
    color: colores[e.venue],
  }));

  const ScatterTooltip = ({ active, payload }) => {
    if (!active || !payload?.length) return null;
    const d = payload[0]?.payload;
    return (
      <div style={{ background: "#1E1E2E", border: `1px solid ${PALETTE.border}`, borderRadius: 8, padding: "8px 12px", fontSize: 12 }}>
        <p style={{ color: d?.color, fontWeight: 700, margin: "0 0 4px" }}>{d?.ciudad}</p>
        <p style={{ color: PALETTE.muted, margin: 0 }}>Ingresos: <strong style={{ color: PALETTE.text }}>${d?.x}M</strong></p>
        <p style={{ color: PALETTE.muted, margin: 0 }}>Utilidad: <strong style={{ color: d?.color }}>${d?.y}M</strong></p>
      </div>
    );
  };

  return (
    <div style={styles.card}>
      <h3 style={styles.cardTitle}>⚡ Ingresos vs Utilidad por Evento</h3>
      <p style={styles.cardSub}>
        Cada punto = un show. <span style={{ color: PALETTE.arena }}>■ Arena</span>{"  "}
        <span style={{ color: PALETTE.estadio }}>■ Estadio</span>{"  "}
        <span style={{ color: PALETTE.palenque }}>■ Palenque</span>
      </p>
      <ResponsiveContainer width="100%" height={280}>
        <ScatterChart>
          <CartesianGrid strokeDasharray="3 3" stroke={PALETTE.border} />
          <XAxis dataKey="x" name="Ingresos" unit="M" tick={{ fill: PALETTE.muted, fontSize: 10 }} label={{ value: "Ingresos ($M)", position: "insideBottom", offset: -4, fill: PALETTE.muted, fontSize: 11 }} />
          <YAxis dataKey="y" name="Utilidad" unit="M" tick={{ fill: PALETTE.muted, fontSize: 10 }} label={{ value: "Utilidad ($M)", angle: -90, position: "insideLeft", fill: PALETTE.muted, fontSize: 11 }} />
          <Tooltip content={<ScatterTooltip />} />
          <Scatter data={data}>
            {data.map((entry, i) => (
              <Cell key={i} fill={entry.color} fillOpacity={0.85} />
            ))}
          </Scatter>
        </ScatterChart>
      </ResponsiveContainer>
    </div>
  );
}

// ── KPI CARDS ──────────────────────────────────────────────────────────────
function KPIs() {
  const totalIngresos = EVENTOS.reduce((s, e) => s + e.ingresos, 0);
  const totalUtilidad = EVENTOS.reduce((s, e) => s + e.utilidad, 0);
  const totalGastos = EVENTOS.reduce((s, e) => s + e.gastos_ext + e.gastos_int, 0);
  const margen = (totalUtilidad / totalIngresos * 100).toFixed(1);
  const mejorEvento = [...EVENTOS].sort((a, b) => b.utilidad - a.utilidad)[0];

  const kpis = [
    { label: "Ingresos Totales", value: fmtM(totalIngresos), color: PALETTE.grande, icon: "💰" },
    { label: "Utilidad Total", value: fmtM(totalUtilidad), color: PALETTE.pequeña, icon: "📈" },
    { label: "Gastos Totales", value: fmtM(totalGastos), color: "#FF6B6B", icon: "📉" },
    { label: "Margen Promedio", value: `${margen}%`, color: PALETTE.arena, icon: "📊" },
    { label: "Mejor Show", value: mejorEvento.ciudad, color: PALETTE.estadio, icon: "🌟", sub: fmtM(mejorEvento.utilidad) },
    { label: "Total de Shows", value: `${EVENTOS.length}`, color: PALETTE.palenque, icon: "🎤" },
  ];

  return (
    <div style={{ display: "grid", gridTemplateColumns: "repeat(3, 1fr)", gap: 12, marginBottom: 24 }}>
      {kpis.map(k => (
        <div key={k.label} style={{ background: PALETTE.card, border: `1px solid ${PALETTE.border}`, borderRadius: 12, padding: "14px 18px", borderLeft: `4px solid ${k.color}` }}>
          <p style={{ color: PALETTE.muted, fontSize: 11, margin: "0 0 4px" }}>{k.icon} {k.label}</p>
          <p style={{ color: k.color, fontSize: k.label === "Mejor Show" ? 14 : 18, fontWeight: 800, margin: 0, fontFamily: "'Bebas Neue', cursive", letterSpacing: 1 }}>{k.value}</p>
          {k.sub && <p style={{ color: PALETTE.pequeña, fontSize: 12, margin: "2px 0 0" }}>{k.sub}</p>}
        </div>
      ))}
    </div>
  );
}
